name: SwagDroid v1.0.0 Full Build & Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:

jobs:
  build-and-verify:
    name: Unit Tests + Debug & R8 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JUnit4 tests across all 11 modules
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --stacktrace --no-daemon > /tmp/gradle_test.log 2>&1; then
            tail -n 60 /tmp/gradle_test.log
            ERR_MSG=$(grep -E "e: |FAILURE:|Caused by:|Execution failed|AssertionError" /tmp/gradle_test.log | tail -n 15 | tr '\n' ' | ')
            echo "::error title=Unit Test / Compile Error::${ERR_MSG:-See step log}"
            cat /tmp/gradle_test.log
            exit 1
          fi
          tail -n 25 /tmp/gradle_test.log

      - name: Assemble Debug & R8-Optimized Release APKs
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon > /tmp/gradle_build.log 2>&1; then
            ERR_MSG=$(grep -E "e: |FAILURE:|Caused by:|Execution failed|Missing class|AGPBI:" /tmp/gradle_build.log | tail -n 18 | tr '\n' ' | ')
            echo "::error title=APK Build Error::${ERR_MSG:-See step log}"
            cat /tmp/gradle_build.log
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload SwagDroid v1.0.0 Release APK (R8 Optimized & Signed)
        uses: actions/upload-artifact@v7
        with:
          name: SwagDroid-v1.0.0-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload SwagDroid v1.0.0 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SwagDroid-v1.0.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk

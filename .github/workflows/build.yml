name: SwagDroid v1.0.0 Full Build & Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:

jobs:
  build-and-verify:
    name: Unit Tests + Debug & R8 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Run Tests & Build Debug + R8 Release APKs
        run: |
          if [ -f ./scripts/ci-build.sh ]; then
            bash ./scripts/ci-build.sh
          else
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload SwagDroid v1.0.0 Release APK (R8 Optimized & Signed)
        uses: actions/upload-artifact@v7
        with:
          name: SwagDroid-v1.0.0-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload SwagDroid v1.0.0 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SwagDroid-v1.0.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
